<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion Étudiants - Océan</title>
    <link rel="stylesheet" href="css/style.css">
  
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🌊 Gestion des Étudiants - Océan</h1>
            <p>integration II </p>
        </div>

        <div class="content">
            <div class="nav-pages">
                <a href="page1.html" class="nav-btn active">Page 1</a>
                <a href="page2.html" class="nav-btn">Page 2</a>
                <a href="page3.html" class="nav-btn">Page 3</a>
                <a href="page4.html" class="nav-btn">Page 4</a>
                <a href="page5.html" class="nav-btn">Page 5</a>
                <a href="page6.html" class="nav-btn">Page 6</a>
                <a href="page7.html" class="nav-btn">Page 7</a>
            </div>

            <div id="message" class="message"></div>

            <div class="stats">
                <div class="stat-card">
                    <h3 id="totalStudents">0</h3>
                    <p>Total Étudiants</p>
                </div>
            </div>

            <div class="form-section">
                <h2>➕ Ajouter un étudiant</h2>
                <form id="studentForm">
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="numero">Numéro étudiant *</label>
                            <input type="text" id="numero" required placeholder="Ex: ETU001">
                        </div>
                        <div class="form-group">
                            <label for="nom">Nom *</label>
                            <input type="text" id="nom" required placeholder="Ex: Rakoto">
                        </div>
                        <div class="form-group">
                            <label for="prenom">Prénom *</label>
                            <input type="text" id="prenom" required placeholder="Ex: Jean">
                        </div>
                        <div class="form-group">
                            <label for="telephone">Téléphone</label>
                            <input type="tel" id="telephone" placeholder="Ex: 034 12 345 67">
                        </div>
                        <div class="form-group">
                            <label for="image">Photo de l'étudiant</label>
                            <input type="file" id="image" accept="image/*">
                            <div class="image-preview" id="imagePreview">
                                <img id="previewImg" src="" alt="Aperçu">
                            </div>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary" id="submitBtn">💾 Enregistrer</button>
                    <button type="button" class="btn btn-print" onclick="imprimerListe()">🖨️ Imprimer</button>
                    <button type="button" class="btn btn-clear" onclick="effacerTout()">🗑️ Effacer tout</button>
                </form>
            </div>

            <div class="table-section">
                <h2 style="color: #0f2027; margin-bottom: 20px;">📋 Liste des étudiants</h2>
                <table>
                    <thead>
                        <tr>
                            <th>Photo</th>
                            <th>N° Étudiant</th>
                            <th>Nom</th>
                            <th>Prénom</th>
                            <th>Téléphone</th>
                            <th class="no-print">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="studentsBody">
                        <tr>
                            <td colspan="6" class="no-data">Aucun étudiant enregistré</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="js/main.js"></script>
</body>
</html>
